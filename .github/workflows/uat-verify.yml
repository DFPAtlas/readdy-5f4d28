# ============================================================
# DFP UAT Agent — CI Verification Workflow
# ============================================================
# Runs on every push and pull request to main.
# Detects TypeScript / lint / build failures, committed secrets,
# unsafe environment files, Docker misconfiguration, and
# vulnerable dependencies before code reaches the UAT VM.
# ============================================================

name: UAT Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel older in-progress runs for the same branch/PR
concurrency:
  group: uat-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # --------------------------------------------------------
      # CI-safe public placeholders (never use real secrets)
      # --------------------------------------------------------
      VITE_PUBLIC_APP_NAME: DFP UAT Agent
      VITE_PUBLIC_APP_URL: http://localhost:3000
      VITE_PUBLIC_DEPLOYMENT_MODE: local
      VITE_PUBLIC_ENABLE_MOCK_UAT: false
      VITE_PUBLIC_UAT_API_BASE_URL: /api/uat
      VITE_PUBLIC_UAT_REALTIME_URL: ''
      VITE_PUBLIC_UAT_DEFAULT_MAX_PAGES: '50'
      VITE_PUBLIC_UAT_DEFAULT_MAX_ACTIONS: '250'
      VITE_PUBLIC_UAT_REQUEST_TIMEOUT_MS: '30000'
      VITE_PUBLIC_UAT_POLL_INTERVAL_MS: '3000'
      VITE_PUBLIC_UAT_ALLOW_PRODUCTION_TESTING: false
      VITE_PUBLIC_UAT_REQUIRE_PRODUCTION_APPROVAL: true
      VITE_PUBLIC_UAT_MASK_SENSITIVE_VALUES: true
      VITE_PUBLIC_UAT_ALLOW_AI_DISABLED_MODE: true
      VITE_PUBLIC_UAT_FAIL_RUN_WHEN_AI_OFFLINE: false
      VITE_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      VITE_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      VITE_PUBLIC_SUPABASE_DEPLOYMENT_MODE: disabled
      VITE_PUBLIC_UAT_EVIDENCE_BUCKET: uat-evidence
      VITE_PUBLIC_UAT_REPORT_BUCKET: uat-reports
      VITE_PUBLIC_UAT_TRACE_BUCKET: uat-traces
      VITE_PUBLIC_ENABLE_UAT_REALTIME: false
      VITE_PUBLIC_UAT_DATABASE_REQUIRED: false
      VITE_PUBLIC_UAT_DATABASE_TIMEOUT_MS: '10000'
      VITE_PUBLIC_UAT_AUTO_RUN_MIGRATIONS: false
      VITE_PUBLIC_UAT_ALLOW_DATABASE_RESET: false
      VITE_PUBLIC_UAT_ALLOWED_DOMAINS: ''
      VITE_PUBLIC_UAT_BLOCKED_DOMAINS: ''
      # Server-only — not used in browser build but needed for docker compose
      N8N_ENCRYPTION_KEY: ci-placeholder-encryption-key
      # CI-only placeholder env vars for Docker Compose validation
      # These are NOT real secrets — used only to pass docker compose config
      N8N_API_TOKEN: ci-placeholder-n8n-token
      PLAYWRIGHT_WORKER_TOKEN: ci-placeholder-worker-token
      UAT_WEBHOOK_SECRET: ci-placeholder-webhook-secret
      UAT_CALLBACK_SECRET: ci-placeholder-callback-secret

    steps:
      # ----------------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Setup Node.js
      # ----------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # ----------------------------------------------------------
      # 3. Install locked dependencies
      # ----------------------------------------------------------
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # ----------------------------------------------------------
      # 4. Repository safety — unsafe committed files
      # ----------------------------------------------------------
      # --- Repository safety check (includes server-only var scanner) ---
      - name: Repository safety check
        run: node scripts/check-repository-safety.mjs

      # --- Security tests ---
      - name: Security module tests
        run: node scripts/test-security.mjs

      # --- Recovery tests ---
      - name: Recovery module tests
        run: node scripts/test-recovery.mjs

      # --- Evidence retention tests ---
      - name: Evidence retention tests
        run: node scripts/test-evidence.mjs

      # --- Disaster recovery tests ---
      - name: Disaster recovery tests
        run: node scripts/test-disaster-recovery.mjs

      # --- Release governance tests ---
      - name: Release governance tests
        run: node scripts/test-release-governance.mjs

      # --- Release webhook dispatch tests ---
      - name: Release webhook dispatch tests
        run: node scripts/test-release-webhook.mjs

      # ----------------------------------------------------------
      # 5. Secret scanning with Gitleaks
      # ----------------------------------------------------------
      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        continue-on-error: false

      # ----------------------------------------------------------
      # 6. TypeScript type checking
      # ----------------------------------------------------------
      # --- TypeScript type check ---
      - name: TypeScript check
        run: npm run type-check

      # ----------------------------------------------------------
      # 7. Lint
      # ----------------------------------------------------------
      # --- Lint ---
      - name: Lint check
        run: npm run lint

      # ----------------------------------------------------------
      # 8. Tests (skip safely when none configured)
      # ----------------------------------------------------------
      # --- Tests (skip if not configured) ---
      - name: Application tests
        id: tests
        continue-on-error: true
        run: |
          if grep -q '"test"' package.json && npm run test -- --passWithNoTests 2>/dev/null; then
            echo "tests_configured=true" >> $GITHUB_OUTPUT
          else
            echo "tests_configured=false" >> $GITHUB_OUTPUT
          fi

      - name: Report test status
        if: steps.tests.outputs.tests_configured != 'true'
        run: echo "::notice::Automated application tests are not yet configured. Skipping."

      # ----------------------------------------------------------
      # 9. Production build
      # ----------------------------------------------------------
      - name: Production build
        run: npm run build

      # ----------------------------------------------------------
      # 10. Validate Docker Compose
      # ----------------------------------------------------------
      - name: Validate Docker Compose
        run: docker compose -f docker-compose.example.yml config

      # ----------------------------------------------------------
      # 11. Dependency vulnerability audit
      # ----------------------------------------------------------
      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

      # ----------------------------------------------------------
      # Summary
      # ----------------------------------------------------------
      - name: Summary
        if: always()
        run: |
          echo "## UAT Verify Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository safety | ${{ job.status == 'success' && 'Passed' || 'See logs' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret scan (Gitleaks) | ${{ job.status == 'success' && 'Passed' || 'See logs' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TypeScript | ${{ steps.tests.outcome == 'success' && 'Passed' || 'See logs' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint | ${{ steps.tests.outcome == 'success' && 'Passed' || 'See logs' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tests | ${{ steps.tests.outputs.status || 'See logs' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Production build | ${{ steps.tests.outcome == 'success' && 'Passed' || 'See logs' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docker Compose | ${{ steps.tests.outcome == 'success' && 'Passed' || 'See logs' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependency audit | ${{ steps.tests.outcome == 'success' && 'Passed' || 'See logs' }} |" >> "$GITHUB_STEP_SUMMARY"