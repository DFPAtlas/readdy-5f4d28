# ============================================================
# DFP UAT Agent — nginx Configuration
# ============================================================
# Serves the built SPA and proxies /api/uat/* to the API gateway.
# In production, replace placeholders with your actual setup.
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (adjust CSP for your environment)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA fallback — serve index.html for all routes
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the UAT gateway
    # Replace TARGET_HOST with your actual API gateway (n8n or reverse proxy)
    location /api/uat/ {
      proxy_pass http://UAT_API_GATEWAY_PLACEHOLDER;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 10s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    # Proxy Ollama requests to Atlas-HaL on the private LAN
    # Replace OLLAMA_BASE_URL_PLACEHOLDER with the actual Ollama URL
    # Example: http://192.168.1.92:11434
    location /api/local/ollama/ {
      proxy_pass http://OLLAMA_BASE_URL_PLACEHOLDER/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 10s;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      # Do not buffer — let long generation requests stream (if needed later)
      proxy_buffering off;
    }

    # Deny access to hidden files
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }
  }
}