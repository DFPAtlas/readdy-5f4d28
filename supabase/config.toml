# ============================================================
# DFP UAT Agent — Local Supabase Configuration
# ============================================================
# For use with Supabase CLI (supabase start / supabase stop).
# This file configures the local Supabase stack for
# development and testing of the UAT Agent.
# ============================================================

# A string used to distinguish different Supabase projects on the same
# host. Defaults to the working directory name when running 'supabase init'.
project_id = "dfp-uat-agent"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false

[realtime]
enabled = true
max_concurrent_users = 200
max_events_per_second = 100
max_bytes_per_second = 100000
max_channels_per_client = 100

[edge_runtime]
enabled = true
policy = "per_worker"

# UAT-specific bucket configuration — create after migrations:
#   supabase storage bucket create uat-evidence --private
#   supabase storage bucket create uat-reports --private  
#   supabase storage bucket create uat-traces --private